[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-extraction-eval"
version = "0.1.0"
description = "Avaliação de extratores de informação com LLM sobre laudos de aptidão (dados sintéticos)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.optional-dependencies]
azure = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
llm-eval = "llm_extraction_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_extraction_eval = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
